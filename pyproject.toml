[project]
name = "azuero"
version = "0.1.0"
description = "Annual 20-30 m canopy height with uncertainty for the Azuero Peninsula, Panama"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "scipy>=1.13",
    "xarray>=2024.6",
    "rasterio>=1.4",
    "rioxarray>=0.17",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "h5py>=3.11",
    "netCDF4>=1.7",
    "earthaccess>=0.11",
    "sliderule>=4.0",
    "pystac-client>=0.8",
    "requests>=2.32",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.4",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Larger models registered in azuero.models.registry; not installed in the small profile.
gpu = ["torch>=2.4"]
dev = ["pytest>=8"]

[project.scripts]
azuero = "azuero.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/azuero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
